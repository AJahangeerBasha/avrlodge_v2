<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="32" fill="url(#bgGradient)"/>

  <!-- Mountain/Hills -->
  <g transform="translate(12, 20)">
    <!-- Back mountain -->
    <path d="M0 24 L10 8 L20 12 L30 6 L40 24 Z" fill="#4b5563" opacity="0.8"/>
    <!-- Front mountain -->
    <path d="M6 24 L16 10 L26 14 L36 8 L40 24 Z" fill="#6b7280"/>

    <!-- Lodge/House -->
    <rect x="16" y="16" width="8" height="8" fill="#0f172a"/>
    <path d="M16 16 L20 12 L24 16 Z" fill="#1f2937"/>

    <!-- Windows with warm light -->
    <rect x="17.5" y="18" width="1.5" height="2" fill="#fbbf24"/>
    <rect x="21" y="18" width="1.5" height="2" fill="#fbbf24"/>

    <!-- Door -->
    <rect x="19" y="20.5" width="2" height="3.5" fill="#fbbf24" opacity="0.7"/>
  </g>

  <!-- AVR letters overlaid -->
  <g transform="translate(32, 32)">
    <text x="0" y="6" text-anchor="middle" fill="#fbbf24" font-family="serif" font-size="16" font-weight="bold" letter-spacing="1px">AVR</text>
  </g>

  <!-- Subtle decorative stars -->
  <circle cx="48" cy="16" r="1" fill="#fbbf24" opacity="0.6"/>
  <circle cx="54" cy="20" r="0.8" fill="#fbbf24" opacity="0.4"/>
  <circle cx="50" cy="24" r="0.6" fill="#fbbf24" opacity="0.3"/>
</svg>